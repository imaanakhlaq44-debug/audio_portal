name: qissora
description: "Qissora - Kids Islamic audio stories by Imaan & Akhlaq"
publish_to: 'none'

version: 1.3.1+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: 6.1.5+1

  # PIN hashing (PBKDF2-HMAC-SHA256)
  crypto: ^3.0.6

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Audio playback (background-capable, lock-screen / notification controls)
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  path_provider: 2.1.5

  # UI & utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Opens WhatsApp for the "Contact Us" buttons on About and FAQs
  url_launcher: ^6.3.2

  # Qissora Premium through Google Play Billing (adds the BILLING permission)
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3

  # Parents sign in with Google before subscribing
  google_sign_in: ^7.2.0

  # Letting a child put their own photo on the home screen. The picture is
  # copied into the app's own folder and never leaves the device.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Story audio is deliberately NOT listed: it is streamed from
    # audio.qissora.app (lib/audio_config.dart). assets/audio/ stays in the
    # repo as the source that tools/upload_audio.ps1 uploads.
    #
    # Series cover art IS bundled: it is ~1.3 MB in total, it shows on every
    # screen, and downloading it would leave grey boxes on a cold start.
    # Masters live in covers/ and are converted by tools/make_covers.ps1.
    - assets/covers/
    - assets/images/
    - assets/icon/
    # Static Plus Jakarta Sans / Bricolage Grotesque faces. google_fonts picks
    # these up from the asset bundle, so typography works offline and in
    # release builds without fetching them.
    - assets/google_fonts/
