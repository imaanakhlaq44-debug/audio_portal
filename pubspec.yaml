name: qissora
description: "Qissora - Kids Islamic audio stories by Imaan & Akhlaq"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: 6.1.5+1

  # PIN hashing (PBKDF2-HMAC-SHA256)
  crypto: ^3.0.6

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Audio playback (background-capable, lock-screen / notification controls)
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  path_provider: 2.1.5

  # UI & utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Flutter does not include subfolders of a listed directory, so every
    # series folder has to be listed on its own.
    - assets/audio/en/fairness/
    - assets/images/
    - assets/icon/
    # Static Plus Jakarta Sans / Bricolage Grotesque faces. google_fonts picks
    # these up from the asset bundle, so typography works offline and in
    # release builds (which have no INTERNET permission).
    - assets/google_fonts/
